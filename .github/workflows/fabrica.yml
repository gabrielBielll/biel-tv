# A fábrica de transcodificação — roda de graça no GitHub Actions.
#
# Acorda quando o Worker dispara um repository_dispatch (job novo na fila) e
# drena a fila inteira antes de encerrar (FACTORY_DRAIN=1). O cron diário do
# Worker re-dispara se sobrar fila (dispatch perdido, run morta no timeout), e
# o workflow_dispatch permite acionar na mão pela aba Actions.
#
# concurrency: uma run por vez — dispatches durante uma run em andamento
# colapsam numa única run enfileirada (o claim é atômico de todo jeito, mas
# assim não queimamos minutos com runners concorrentes).
name: fabrica

on:
  repository_dispatch:
    types: [fabrica]
  workflow_dispatch:

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  transcodifica:
    runs-on: ubuntu-latest
    # folga pra lotes grandes (17 vídeos ≈ 45min na EC2; runner tem 4 vCPU) —
    # minutos são cobrados por uso real, timeout alto não custa nada; se ainda
    # assim estourar, o self-heal do claim devolve o job preso pra fila em 2h
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: garante ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # whisper (fase 12): transcreve comerciais/vinhetas na ingestão pra
      # extrair as "promessas" — cache do modelo (~460MB) entre runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: whisper-small-${{ runner.os }}
      - name: faster-whisper + yt-dlp
        run: pip install --quiet faster-whisper yt-dlp

      # cookies do YouTube (opcional): se o secret YT_COOKIES existir, vira
      # arquivo e o yt-dlp passa a se apresentar como o navegador do Gabriel —
      # é o plano B definitivo contra o "Sign in to confirm you're not a bot"
      - name: cookies do youtube (se configurados)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > /tmp/yt-cookies.txt
            echo "YT_COOKIES_FILE=/tmp/yt-cookies.txt" >> "$GITHUB_ENV"
            echo "cookies configurados"
          else
            echo "sem cookies (ok — só precisa se o YouTube barrar o runner)"
          fi

      - name: dependências (só runtime — sem playwright/browsers)
        run: pnpm install --prod --frozen-lockfile

      - name: drena a fila de ingestão
        env:
          BASE: https://biel-tv-stream.biel-cesa95.workers.dev
          FACTORY_TARGET: remote
          FACTORY_DRAIN: '1'
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: biel-tv-media
          # o passo final do pipeline registra a mídia no D1 via wrangler —
          # sem estas duas, o job transcodifica tudo e morre no registro
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '97603ea0b9784ad4a9d3b80bd73f1ea4'
        run: node scripts/factory-local.mjs
