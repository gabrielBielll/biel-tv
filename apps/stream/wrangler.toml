# Biel TV — Worker de streaming (o "Operador": rápido, burro e eficiente)
name = "biel-tv-stream"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[vars]
# Produção: viagem no tempo DESLIGADA. Em dev o .dev.vars sobrepõe com "1".
ALLOW_TIME_TRAVEL = "0"
# Repo da fábrica no GitHub Actions (repository_dispatch ao entrar job na fila).
# O token fica no secret GH_DISPATCH_TOKEN; sem ele o dispatch é pulado em silêncio.
GH_REPO = "gabrielBielll/biel-tv"
# ADMIN_TOKEN é secret em produção (`wrangler secret put ADMIN_TOKEN`);
# em dev vem do .dev.vars.

[[d1_databases]]
binding = "DB"
database_name = "biel-tv-db"
database_id = "c7790950-7ee9-4169-8d0c-40e7ce8672d9"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "biel-tv-media"

[triggers]
# Diretor de programação (fase 4): 06:00 UTC = 03:00 America/Sao_Paulo
crons = ["0 6 * * *"]
